name: Validate website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - run: node --check assets/main.js
      - run: node --check assets/analytics.js
      - run: node --test scripts/analytics.test.mjs
      - run: node scripts/check.mjs
      - run: git diff --exit-code -- index.html en/index.html sitemap.xml robots.txt
